# awesome-learning 数据源。README.md 由 scripts/build.R 从这里生成，不要手改 README。
#
# 字段：
#   id             唯一标识，小写，用连字符
#   type           package | book | site
#   section        所属板块，README 按此分组、按首次出现的顺序排列
#   name           显示名
#   url            主链接，README 里名称指向这里
#   repo           GitHub owner/repo（可选），有则由 scripts/refresh_stars.R 自动刷 star
#   homepage       文档或在线阅读地址（可选）
#   lang           R | Python（可选）
#   source         CRAN | Bioconductor | GitHub | PyPI（package 用，可选）
#   description_zh 一句话中文描述，必填
#   description_en 英文描述（可选，多取自 GitHub 描述）
#   tags           标签列表（可选）
#   status         using 在用 | tried 试过 | to-read 待读
#   note           个人批注，必填：为什么留、在哪用过、踩过什么坑
#   related        对应自己的哪个包（可选）
#   authors        book 用（可选）
#   free_online    book 用，是否可免费在线阅读（可选）

# ---------------------------------------------------------------- 因果推断

- id: grf
  type: package
  section: 因果推断
  name: grf
  url: https://github.com/grf-labs/grf
  repo: grf-labs/grf
  homepage: https://grf-labs.github.io/grf/
  lang: R
  source: CRAN
  description_zh: "广义随机森林：因果森林、异质处理效应与工具变量森林"
  description_en: "Generalized Random Forests"
  tags: [causal-forest, HTE, effect-modifier]
  status: tried
  note: "拿它找效应修饰变量时没跑赢 OLS 交互扫描；适合估计 CATE，不适合当变量筛选器。"

