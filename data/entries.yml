- id: stratifiedmedicine
  type: package
  section: 因果推断
  name: StratifiedMedicine
  url: https://cran.r-project.org/package=StratifiedMedicine
  repo: thomasjemielita/StratifiedMedicine
  lang: R
  source: CRAN
  description_zh: "亚组识别与分层医学框架：PRISM 流程串起变量过滤、倾向评分、亚组模型与效应估计"
  description_en: "Stratified Medicine: subgroup identification via the PRISM framework"
  tags: [subgroup, HTE, MOB, PRISM]
  status: tried
  note: "用 MOB 找效应修饰变量必须传 parm=2，否则预后变量也会被当成分裂点；先做变量过滤反而会多切出假亚组；“没找到亚组”表现为直接报错而不是空结果。"

- id: model4you
  type: package
  section: 因果推断
  name: model4you
  url: https://cran.r-project.org/package=model4you
  lang: R
  source: CRAN
  description_zh: "个体化处理效应的模型树与模型森林（pmtree / pmforest），基于 partykit"
  description_en: "Stratified and personalised models based on model-based trees and forests"
  tags: [model-based-forest, HTE, effect-modifier, partykit]
  status: tried
  note: "pmforest 的变量重要性排效应修饰变量拿过 10/10；varimp 会随机报 contrasts 错，根因是建森林时没限定每个节点两臂的最小样本量。"

